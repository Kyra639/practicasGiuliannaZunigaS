<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Información Personal</title>
</head>
<body>

    <h1>Formulario: Acerca de mí</h1>
    <p>Por favor, completa la siguiente información para registrarte.</p>

    <form action="#" method="POST">
        
        <div>
            <label for="nombre">Ingresa tú Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div><br>

        <div>
            <label for="edad">Ingresa tú Edad:</label>
            <input type="number" id="edad" name="edad" min="0" max="120">
        </div><br>

        <div>
            <label for="fecha_nac">Ingresa tú Fecha de nacimiento:</label>
            <input type="date" id="fecha_nac" name="fecha_nac">
        </div><br>

        <div>
            <label for="color_fav">Ingresa tú Color favorito:</label>
            <input type="color" id="color_fav" name="color_fav">
        </div><br>

        <div>
            <label for="comida">Ingresa tú Comida favorita:</label>
            <input type="text" id="comida" name="comida">
        </div><br>

        <div>
            <label for="hobbie">Ingresa tú Hobbie favorito:</label>
            <input type="text" id="hobbie" name="hobbie">
        </div><br>

            <legend>¿Qué mascotas tienes?</legend>
            
            <input type="checkbox" id="gato" name="mascota" value="gato">
            <label for="gato">Gatos</label><br>

            <input type="checkbox" id="perro" name="mascota" value="perro">
            <label for="perro">Perros</label><br>

            <input type="checkbox" id="ambos" name="mascota" value="ambos">
            <label for="ambo">Ambos</label><br>

            <input type="checkbox" id="ninguno" name="ninguno" value="ninguno">
            <label for="ninguno">Ninguno</label><br>
            <br>

        <button type="submit">Guardar</button>

    </form>

</body>
</html>
